[package]
name = "systemhog"
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
description = "A CPU and RAM resource maintainer that holds system usage at your configured levels"
license = "GPL-3.0"
publish = false

# Smallest possible binary: optimize for size, single codegen unit,
# LTO across the whole crate, strip all symbols, abort on panic.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
