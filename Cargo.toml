[package]
name = "systemhog"
version = "0.3.1"
edition = "2024"
rust-version = "1.85"
description = "CPU and RAM resource maintainer - keeps system usage at configured levels"
license = "GPL-3.0"
publish = false

# Smallest possible binary: optimize for size, single codegen unit,
# LTO across the whole crate, strip all symbols, abort on panic.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[dependencies]

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.189"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_SystemInformation", "Win32_System_Threading"] }
