name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux musl: fully static, single file, no runtime deps.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            flags: -C linker=rust-lld
            pkgs: ""
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            flags: -C linker=rust-lld
            pkgs: ""
          - os: ubuntu-latest
            target: armv7-unknown-linux-musleabihf
            flags: -C linker=rust-lld
            pkgs: ""
          - os: ubuntu-latest
            target: i686-unknown-linux-musl
            flags: -C linker=rust-lld
            pkgs: ""
          - os: ubuntu-latest
            target: riscv64gc-unknown-linux-musl
            flags: -C linker=rust-lld -C link-self-contained=yes -C link-arg=-L/tmp/riscv-stub -C link-arg=-lunwind
            pkgs: ""
          # Linux glibc: dynamically linked (standard), cross-compiled.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            flags: ""
            pkgs: ""
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            flags: -C linker=aarch64-linux-gnu-gcc
            pkgs: gcc-aarch64-linux-gnu
          - os: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            flags: -C linker=arm-linux-gnueabihf-gcc
            pkgs: gcc-arm-linux-gnueabihf
          # Windows / macOS: native runners, native toolchains.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            flags: ""
            pkgs: ""
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            flags: ""
            pkgs: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            flags: ""
            pkgs: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            flags: ""
            pkgs: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cross compilers
        if: ${{ matrix.pkgs != '' }}
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.pkgs }}
      - name: Add target
        run: rustup target add ${{ matrix.target }}
      - name: Build
        env:
          RUSTFLAGS: ${{ matrix.flags }}
        run: |
          if [[ "${{ matrix.target }}" == riscv64gc* ]]; then
            mkdir -p /tmp/riscv-stub
            ar cr /tmp/riscv-stub/libgcc_s.a
          fi
          cargo build --release --target ${{ matrix.target }}
      - name: Rename artifact
        shell: bash
        run: |
          mkdir -p dist
          ext=""
          [[ "${{ matrix.target }}" == *windows* ]] && ext=".exe"
          cp "target/${{ matrix.target }}/release/systemhog$ext" "dist/systemhog-${{ matrix.target }}$ext"
      - uses: actions/upload-artifact@v4
        with:
          name: systemhog-${{ matrix.target }}
          path: dist/systemhog-${{ matrix.target }}*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Add install scripts and checksums
        run: |
          cp install.sh uninstall.sh dist/
          cd dist
          for f in systemhog-*; do
            [ -f "$f" ] || continue
            sha256sum "$f" > "$f.sha256"
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
